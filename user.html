<!DOCTYPE html>
<html lang="en" style="font-family: 'Nunito', sans-serif;">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="assets/mainLogo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title id="title">Player Profile</title>
  </head>

  <body style="padding:40px;max-width:1400px;margin:auto;">

    <h1 style="top:1%">
        <a href="index.html" target="_blank" rel="noopener" style=" text-decoration: none;color:black;">Generic Clicker Game</a>
    </h1>


    <div style="padding:35px;border-radius:24px;margin:60px 10px;position:relative;font-size: 32px;margin-bottom: 20px;white-space: nowrap;">
        <div style="display:flex;align-items:center;gap:20px;">

            <h1 id="username" style="margin:0;overflow-wrap:anywhere;">
            Loading...
            </h1>

        </div>
    </div>

    <div style="
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
        gap:20px;
        margin-bottom:40px;
    ">

        <div style="
        border: 2px solid black;
        box-shadow: 5px 5px 0 0 black;
        padding:24px;
        border-radius:22px; 
        overflow-wrap: anywhere;    
        ">
        <div style="font-size:13px;font-weight:700;letter-spacing:1px;">
            SCORE
        </div>

        <div id="score" style="
            font-size:48px;
            font-weight:700;
            margin-top:10px;
        ">
            Loading...
        </div>
        </div>

        <div style="
        border: 2px solid black;
        box-shadow: 5px 5px 0 0 black;
        padding:24px;
        border-radius:22px;  
        ">
        <div style="font-size:13px;font-weight:700;letter-spacing:1px;">
            PRESTIGE
        </div>

        <div id="prestige" style="
            font-size:48px;
            font-weight:700;
            margin-top:10px;
        ">
            Loading...
        </div>
        </div>

        <div style="
        border: 2px solid black;
        box-shadow: 5px 5px 0 0 black;
        padding:24px;
        border-radius:22px;  
        ">
        <div style="font-size:13px;font-weight:700;letter-spacing:1px;">
            RANK
        </div>

        <div id="rank" style="
            font-size:48px;
            font-weight:700;
            margin-top:10px;
        ">
            Loading...
        </div>
        </div>

    </div>

    <div style="
        border: 2px solid black;
        box-shadow: 5px 5px 0 0 black;
        padding:24px;
        border-radius:22px;
        margin-bottom:30px;
    ">
        <h2 style="margin-top:0;font-size:36px;">
        <i class="fa-solid fa-arrow-trend-up"></i>
        Upgrades
        </h2>

        <div id="upgrades" style="
        display:flex;
        flex-wrap:wrap;
        gap:12px;
        margin-top:20px;
        ">
        Loading upgrades...
        </div>
    </div>

    <div style="
        border: 2px solid black;
        box-shadow: 5px 5px 0 0 black;
        padding:24px;
        border-radius:22px;
        margin-bottom:30px;
    ">
        <h2 style="margin-top:0;font-size:36px;">
        <i class="fa-solid fa-award"></i>
        Achievements
        </h2>

        <div id="achievements" style="
        display:flex;
        flex-wrap:wrap;
        gap:12px;
        margin-top:20px;
        ">
        Loading achievements...
        </div>
    </div>

    <p class="auto-save" style="white-space: nowrap;">© 2026 Generic Clicker Game 5<code class="new" id="updatesBtn">NEW</code>&bull; Made by <a href="chadwickbroski.github.io" style="color:#002CF2;">ChadwickBroski</a>. &bull; <i class="fa-brands fa-github"></i> Hosted on GITHUB</p>
    <script type="module" src="userScript.js"></script>
    </body>
</html>
